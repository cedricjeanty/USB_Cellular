[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200

board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.flash_mode = dio
board_build.partitions = partitions.csv

; OPI PSRAM
board_build.arduino.memory_type = qio_opi

; Hardware E2E build: identical to esp32s3 but honors the CDC_PERSIST magic file
; (persistent CDC+MSC so the test harness keeps a serial log across reboots).
; Production OTA builds use plain [env:esp32s3], which ignores CDC_PERSIST.
[env:esp32s3-e2e]
extends = env:esp32s3
build_flags = -DALLOW_CDC_PERSIST

[env:native]
platform = native
test_framework = unity
build_flags =
    -std=c++17
    -I include
    -lpthread
    -lutil
    -lz
; test_native_sd_block vendors its own self-contained FatFs (its ff.c/ffconf.h/
; diskio.c/ff.h/diskio.h, LFN=0). lib/fatfs_native (LFN=1) is deliberately NOT on
; the native include path so its ffconf can't collide with the vendored one.
test_filter = test_native_*

[env:emulator]
platform = native
; Compile the shared FatFs (LFN=1) so EMU_SD_BLOCK=1 can back the SD with a real
; FAT image on an in-memory FakeSd (include/hal/fatfs_filesys.h).
build_src_filter = -<src/> +<../emu/> +<../lib/fatfs_native/src/ff.c> +<../lib/fatfs_native/src/diskio.c> +<../lib/fatfs_native/src/ffunicode.c>
build_flags =
    -std=c++17
    -I include
    -I lib/fatfs_native/include
    -I/usr/include/SDL2
    -D_REENTRANT
    -lSDL2
    -lssl
    -lcrypto
    -lpthread
    -lutil
